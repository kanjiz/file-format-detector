<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファイル形式検出ツール</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"
    integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    // CDNが失敗した場合のフォールバック
    if (typeof CryptoJS === 'undefined') {
      document.write('<script src="./lib/crypto-js.min.js"><\/script>');
    }
  </script>
  <style>
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2d2d2d;
      --bg-tertiary: #333333;
      --bg-quaternary: #383838;
      --bg-hover: #404040;
      --text-primary: #ffffff;
      --text-secondary: #e0e0e0;
      --text-muted: #cccccc;
      --text-subtle: #b0b0b0;
      --border-primary: #404040;
      --border-secondary: #555555;
      --accent-blue: #4a90e2;
      --accent-green: #4caf50;
      --accent-red: #f44336;
      --font-mono: 'Courier New', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "BIZ UDPゴシック", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo UI", sans-serif;
      font-size: 24px;
      background: var(--bg-primary);
      color: var(--text-secondary);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border-primary);
    }

    header {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 30px;
      text-align: center;
      border-bottom: 1px solid var(--border-primary);

      h1 {
        font-size: 2.2em;
        margin-bottom: 10px;
        font-weight: 600;
      }

      p {
        font-size: 1.1em;
        color: var(--text-muted);
      }
    }

    .content {
      padding: 40px;
    }

    .file-areas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .file-area {
      border: 2px dashed var(--border-secondary);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: var(--bg-quaternary);

      &:hover {
        border-color: var(--accent-blue);
        background: var(--bg-hover);
      }

      &.dragover {
        border-color: var(--accent-blue);
        background: var(--bg-hover);
      }

      h3 {
        color: var(--text-primary);
        margin-bottom: 15px;
        font-size: 1.3em;
        font-weight: 500;
      }

      p {
        color: var(--text-subtle);
        margin-bottom: 20px;
      }
    }

    .file-info {
      text-align: left;
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 15px;
      border-radius: 4px;
      margin-top: 15px;
      border: 1px solid var(--border-primary);

      div {
        margin-bottom: 8px;
        font-size: 0.9em;
      }

      strong {
        color: var(--text-primary);
        display: inline-block;
        width: 80px;
      }
    }

    .file-upload-section {
      margin-bottom: 40px;

      h2 {
        color: var(--text-primary);
        font-size: 1.5em;
        margin-bottom: 20px;
        font-weight: 500;
      }
    }

    .comparison-section {
      .comparison {
        background: var(--bg-tertiary);
        color: var(--text-primary);
        padding: 30px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid var(--border-primary);

        h2 {
          margin-bottom: 20px;
          font-size: 1.8em;
          font-weight: 500;
        }
      }
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 25px;
    }

    .comparison-item {
      background: var(--bg-hover);
      color: var(--text-secondary);
      padding: 20px;
      border-radius: 4px;
      border: 1px solid var(--border-secondary);

      h4 {
        margin-bottom: 10px;
        font-size: 1.1em;
        color: var(--text-primary);
        font-weight: 500;
      }
    }

    .comparison-value {
      font-family: var(--font-mono);
      font-size: 0.9em;
      word-break: break-all;
    }

    .match {
      color: var(--accent-green);
      font-weight: 600;
    }

    .no-match {
      color: var(--accent-red);
      font-weight: 600;
    }

    .unavailable {
      color: var(--text-subtle);
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .file-signature {
      background: var(--bg-primary);
      color: var(--text-secondary);
      padding: 15px;
      border-radius: 4px;
      margin-top: 15px;
      border: 1px solid var(--accent-blue);

      h4 {
        color: var(--accent-blue);
        margin-bottom: 10px;
        font-weight: 500;
      }
    }

    .hex-display {
      font-family: var(--font-mono);
      background: var(--bg-primary);
      color: var(--accent-green);
      padding: 10px;
      border-radius: 4px;
      font-size: 0.85em;
      letter-spacing: 1px;
      border: 1px solid var(--border-primary);
    }

    @media (max-width: 768px) {
      .content {
        padding: 20px;
      }
    }

    .crypto-notice {
      background: rgba(255, 193, 7, 0.1);
      border: 1px solid rgba(255, 193, 7, 0.3);
      color: var(--text-muted);
      padding: 12px 20px;
      text-align: center;
      font-size: 0.9em;
      border-radius: 0;
      margin: 0;
    }

    .crypto-notice.hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>ファイル形式理解ツール</h1>
      <p>拡張子を変えても、ファイルの中身は変わりません！実際に確認してみましょう。</p>
    </header>

    <div id="cryptoNotice" class="crypto-notice hidden">
      ⚠️ オフライン環境で動作中です。MD5ハッシュは表示されませんが、ファイルサイズと形式による比較は正常に機能します。
    </div>

    <main class="content">
      <section class="file-upload-section">
        <h2>ファイル比較</h2>
        <div class="file-areas">
          <div class="file-area" id="dropArea1">
            <h3>元のファイル</h3>
            <p>ここにファイルをドラッグ&amp;ドロップしてください</p>
            <div id="fileInfo1" class="file-info hidden"></div>
            <div id="signature1" class="file-signature hidden"></div>
          </div>

          <div class="file-area" id="dropArea2">
            <h3>拡張子を変更したファイル</h3>
            <p>拡張子を変更したファイルをドラッグ&amp;ドロップしてください</p>
            <div id="fileInfo2" class="file-info hidden"></div>
            <div id="signature2" class="file-signature hidden"></div>
          </div>
        </div>
      </section>

      <section class="comparison-section">
        <div id="comparison" class="comparison hidden">
          <h2>比較結果</h2>
          <p id="comparisonMessage"></p>

          <div class="comparison-grid">
            <div class="comparison-item">
              <h4>ファイルサイズ</h4>
              <div id="sizeComparison" class="comparison-value"></div>
            </div>

            <div class="comparison-item">
              <h4>MD5ハッシュ</h4>
              <div id="hashComparison" class="comparison-value"></div>
            </div>

            <div class="comparison-item">
              <h4>実際の形式</h4>
              <div id="formatComparison" class="comparison-value"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    /**
     * ファイル1のデータを保持するグローバル変数
     * @type {Object|null}
     */
    let file1 = null;

    /**
     * ファイル2のデータを保持するグローバル変数
     * @type {Object|null}
     */
    let file2 = null;

    /**
     * CryptoJSライブラリが利用可能かどうかを判定する
     * @returns {boolean} CryptoJSが利用可能な場合true
     */
    function canUseCrypto() {
      return typeof CryptoJS !== 'undefined' && CryptoJS.MD5;
    }

    // 個別ファイル形式判定関数

    /**
     * BMP形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} BMP形式の場合true
     */
    function isBMP(uint8Array) {
      return uint8Array[0] === 0x42 && uint8Array[1] === 0x4D;
    }

    /**
     * GIF形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} GIF形式の場合true
     */
    function isGIF(uint8Array) {
      return uint8Array[0] === 0x47 && uint8Array[1] === 0x49 && uint8Array[2] === 0x46;
    }

    /**
     * JPEG形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} JPEG形式の場合true
     */
    function isJPEG(uint8Array) {
      return uint8Array[0] === 0xFF && uint8Array[1] === 0xD8 && uint8Array[2] === 0xFF;
    }

    /**
     * PDF形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} PDF形式の場合true
     */
    function isPDF(uint8Array) {
      return uint8Array[0] === 0x25 && uint8Array[1] === 0x50 &&
        uint8Array[2] === 0x44 && uint8Array[3] === 0x46;
    }

    /**
     * PNG形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} PNG形式の場合true
     */
    function isPNG(uint8Array) {
      return uint8Array[0] === 0x89 && uint8Array[1] === 0x50 &&
        uint8Array[2] === 0x4E && uint8Array[3] === 0x47;
    }

    /**
     * PSD形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} PSD形式の場合true
     */
    function isPSD(uint8Array) {
      return uint8Array[0] === 0x38 && uint8Array[1] === 0x42 &&
        uint8Array[2] === 0x50 && uint8Array[3] === 0x53;
    }

    /**
     * WebP形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} WebP形式の場合true
     */
    function isWebP(uint8Array) {
      return uint8Array[0] === 0x52 && uint8Array[1] === 0x49 &&
        uint8Array[2] === 0x46 && uint8Array[3] === 0x46 &&
        uint8Array[8] === 0x57 && uint8Array[9] === 0x45 &&
        uint8Array[10] === 0x42 && uint8Array[11] === 0x50;
    }

    /**
     * ZIP形式かどうかを判定する
     * @param {Uint8Array} uint8Array - ファイルのバイト配列
     * @returns {boolean} ZIP形式の場合true
     */
    function isZIP(uint8Array) {
      return uint8Array[0] === 0x50 && uint8Array[1] === 0x4B &&
        (uint8Array[2] === 0x03 || uint8Array[2] === 0x05);
    }

    /**
     * ファイル形式を検出する
     * @param {ArrayBuffer} arrayBuffer - ファイルデータ
     * @returns {{format: string, signature: string, description: string}} 検出結果オブジェクト
     */
    function detectFileFormat(arrayBuffer) {
      const uint8Array = new Uint8Array(arrayBuffer);
      const firstBytes = Array.from(uint8Array.slice(0, 8)).map(b => b.toString(16).padStart(2, '0')).join(' ').toUpperCase();

      // ファイル形式の検出
      if (isJPEG(uint8Array)) {
        return { format: 'JPEG', signature: firstBytes, description: 'JPEG画像ファイル' };
      }

      if (isPNG(uint8Array)) {
        return { format: 'PNG', signature: firstBytes, description: 'PNG画像ファイル' };
      }

      if (isPDF(uint8Array)) {
        return { format: 'PDF', signature: firstBytes, description: 'PDFファイル' };
      }

      if (isZIP(uint8Array)) {
        return { format: 'ZIP', signature: firstBytes, description: 'ZIP圧縮ファイル' };
      }

      if (isGIF(uint8Array)) {
        return { format: 'GIF', signature: firstBytes, description: 'GIF画像ファイル' };
      }

      if (isBMP(uint8Array)) {
        return { format: 'BMP', signature: firstBytes, description: 'BMP画像ファイル' };
      }

      if (isPSD(uint8Array)) {
        return { format: 'PSD', signature: firstBytes, description: 'Photoshop画像ファイル' };
      }

      if (isWebP(uint8Array)) {
        return { format: 'WebP', signature: firstBytes, description: 'WebP画像ファイル' };
      }

      return { format: '不明', signature: firstBytes, description: '不明な形式' };
    }

    /**
     * MD5ハッシュを計算する（CryptoJSが利用可能な場合のみ）
     * @param {ArrayBuffer} arrayBuffer - ファイルデータ
     * @returns {string} MD5ハッシュ値（16進数文字列）または代替メッセージ
     */
    function calculateMD5(arrayBuffer) {
      if (canUseCrypto()) {
        const wordArray = CryptoJS.lib.WordArray.create(arrayBuffer);
        return CryptoJS.MD5(wordArray).toString();
      } else {
        return '利用不可（オフライン環境）';
      }
    }

    /**
     * ファイル基本情報のHTMLを生成する
     * @param {File} file - ファイルオブジェクト
     * @param {string} hash - MD5ハッシュ値
     * @returns {string} ファイル情報のHTML
     */
    function createFileInfoHTML(file, hash) {
      return `
                <div><strong>名前:</strong> ${file.name}</div>
                <div><strong>サイズ:</strong> ${file.size.toLocaleString()} バイト</div>
                <div><strong>拡張子:</strong> ${file.name.split('.').pop().toUpperCase()}</div>
                <div><strong>MD5:</strong> <span style="font-family: var(--font-mono); font-size: 0.8em;">${hash}</span></div>
            `;
    }

    /**
     * ファイル形式情報のHTMLを生成する
     * @param {Object} formatInfo - ファイル形式情報
     * @returns {string} 形式情報のHTML
     */
    function createSignatureHTML(formatInfo) {
      return `
                <h4>実際のファイル形式: ${formatInfo.format}</h4>
                <div><strong>説明:</strong> ${formatInfo.description}</div>
                <div><strong>ファイルヘッダー:</strong></div>
                <div class="hex-display">${formatInfo.signature}</div>
            `;
    }

    /**
     * ファイル情報を表示する
     * @param {File} file - ファイルオブジェクト
     * @param {ArrayBuffer} arrayBuffer - ファイルデータ
     * @param {number} areaId - 表示エリアのID（1または2）
     * @returns {{file: File, arrayBuffer: ArrayBuffer, formatInfo: Object, hash: string}} ファイル情報オブジェクト
     */
    function displayFileInfo(file, arrayBuffer, areaId) {
      const fileInfo = document.getElementById(`fileInfo${areaId}`);
      const signature = document.getElementById(`signature${areaId}`);
      const formatInfo = detectFileFormat(arrayBuffer);
      const hash = calculateMD5(arrayBuffer);

      fileInfo.innerHTML = createFileInfoHTML(file, hash);
      signature.innerHTML = createSignatureHTML(formatInfo);

      fileInfo.classList.remove('hidden');
      signature.classList.remove('hidden');

      return { file, arrayBuffer, formatInfo, hash };
    }

    /**
     * ファイル比較項目の定義配列
     * 各項目には以下のプロパティが含まれる：
     * @typedef {Object} ComparisonDefinition
     * @property {string} key - 比較項目のキー（DOM要素IDに使用）
     * @property {function(Object): *} getValue - ファイルデータから値を取得する関数
     * @property {string} displayName - 表示用の名前
     * @property {function(): boolean} [isAvailable] - この比較項目が利用可能かを判定する関数（オプション）
     * @property {function(*, *): string} formatDisplay - 2つの値を比較表示用文字列に変換する関数
     *
     * @type {ComparisonDefinition[]}
     */
    const COMPARISON_DEFINITIONS = [
      {
        key: 'size',
        getValue: (fileData) => fileData.file.size,
        displayName: 'ファイルサイズ',
        formatDisplay: (val1, val2) => `${val1.toLocaleString()}バイト vs ${val2.toLocaleString()}バイト`
      },
      {
        key: 'hash',
        getValue: (fileData) => fileData.hash,
        displayName: 'MD5ハッシュ',
        isAvailable: () => canUseCrypto(),
        formatDisplay: (val1, val2) => `
          <div style="font-size: 0.7em; margin-bottom: 5px;">${val1}</div>
          <div style="font-size: 0.7em; margin-bottom: 5px;">${val2}</div>`
      },
      {
        key: 'format',
        getValue: (fileData) => fileData.formatInfo.format,
        displayName: '実際の形式',
        formatDisplay: (val1, val2) => `${val1} vs ${val2}`
      }
    ];

    /**
     * ファイル比較結果を作成する
     * @typedef {Object} ComparisonResult
     * @property {*} file1Value - ファイル1の値
     * @property {*} file2Value - ファイル2の値
     * @property {boolean|null} match - 値が一致するか（null=比較不可）
     * @property {boolean} isAvailable - この比較項目が利用可能か
     * @property {string} displayName - 表示用の名前
     * @property {function(*, *): string} formatDisplay - 表示用フォーマット関数
     *
     * @param {Object} file1 - ファイル1のデータ
     * @param {Object} file2 - ファイル2のデータ
     * @returns {Object.<string, ComparisonResult>} 比較結果オブジェクト（キーは比較項目のkey）
     */
    function createComparisons(file1, file2) {
      return COMPARISON_DEFINITIONS.reduce((acc, def) => {
        const isAvailable = def.isAvailable ? def.isAvailable() : true;
        const val1 = def.getValue(file1);
        const val2 = def.getValue(file2);

        acc[def.key] = {
          file1Value: val1,
          file2Value: val2,
          match: isAvailable ? val1 === val2 : null,
          isAvailable,
          displayName: def.displayName,
          formatDisplay: def.formatDisplay
        };
        return acc;
      }, {});
    }
    /**
     * 比較メッセージを生成する
     * @param {Object.<string, ComparisonResult>} comparisons - 比較結果オブジェクト
     * @returns {{message: string, background: string}} メッセージ情報
     */
    function createComparisonMessage(comparisons) {
      const allMatch = Object.values(comparisons).every(comp =>
        comp.match === true || comp.match === null
      );
      const hasUnavailable = Object.values(comparisons).some(comp =>
        comp.match === null
      );

      if (allMatch) {
        let message = '<strong>完全に同じファイルです！</strong><br>拡張子を変更しても、ファイルの中身は全く変わっていません。';
        if (hasUnavailable) {
          message += '<br><small>※ MD5ハッシュは利用できませんが、ファイルサイズと形式で確認できました。</small>';
        }
        return { message, background: 'rgba(76, 175, 80, 0.3)' };
      } else {
        return {
          message: '<strong>異なるファイルです</strong><br>これらは実際に異なるファイルです。',
          background: 'rgba(244, 67, 54, 0.3)'
        };
      }
    }

    /**
     * 比較結果のマッチテキストを生成する
     * @param {boolean|null} match - マッチ結果（true=同じ, false=異なる, null=比較不可）
     * @param {string} key - 比較項目のキー
     * @returns {string} 表示用のマッチテキスト
     */
    function getMatchText(match, key) {
      if (match === null) {
        return '比較不可';
      }

      if (match) {
        return '同じ';
      }

      // 異なる場合、項目によってテキストを変える
      switch (key) {
        case 'format':
          return '異なる形式';
        default:
          return '異なる';
      }
    }

    /**
     * 比較結果のCSSクラス名を生成する
     * @param {boolean|null} match - マッチ結果（true=同じ, false=異なる, null=比較不可）
     * @returns {string} CSSクラス名
     */
    function getMatchClass(match) {
      if (match === null) {
        return 'unavailable';
      }

      return match ? 'match' : 'no-match';
    }

    /**
     * 比較結果の詳細を表示する
     * @param {Object.<string, ComparisonResult>} comparisons - 比較結果オブジェクト
     */
    function displayComparisonDetails(comparisons) {
      Object.entries(comparisons).forEach(([key, comp]) => {
        const element = document.getElementById(`${key}Comparison`);
        if (!element) return;

        const displayText = comp.formatDisplay(comp.file1Value, comp.file2Value);
        const matchClass = getMatchClass(comp.match);
        const matchText = getMatchText(comp.match, key);

        element.innerHTML = `
          ${displayText}
          <br><span class="${matchClass}">${matchText}</span>
        `;
      });
    }

    /**
     * 2つのファイルを比較して結果を表示する
     */
    function compareFiles() {
      if (!file1 || !file2) return;

      const comparison = document.getElementById('comparison');
      const message = document.getElementById('comparisonMessage');

      const comparisons = createComparisons(file1, file2);
      const messageInfo = createComparisonMessage(comparisons);

      message.innerHTML = messageInfo.message;
      message.style.background = messageInfo.background;

      displayComparisonDetails(comparisons);
      comparison.classList.remove('hidden');
    }

    /**
     * ドラッグ&ドロップイベントを設定する
     * @param {HTMLElement} dropArea - ドロップエリア要素
     */
    function setupDragEvents(dropArea) {
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, preventDefaults, false);
      });

      function preventDefaults(e) {
        e.preventDefault();
        e.stopPropagation();
      }

      ['dragenter', 'dragover'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.add('dragover'), false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        dropArea.addEventListener(eventName, () => dropArea.classList.remove('dragover'), false);
      });
    }

    /**
     * ファイル読み込み完了時の処理
     * @param {File} file - ファイルオブジェクト
     * @param {ArrayBuffer} arrayBuffer - ファイルデータ
     * @param {number} areaId - エリアID
     */
    function handleFileLoad(file, arrayBuffer, areaId) {
      const fileData = displayFileInfo(file, arrayBuffer, areaId);

      if (areaId === 1) {
        file1 = fileData;
      } else {
        file2 = fileData;
      }

      compareFiles();
    }

    /**
     * ファイルドロップ時の処理
     * @param {DragEvent} e - ドラッグイベント
     * @param {number} areaId - エリアID
     */
    function handleFileDrop(e, areaId) {
      const files = e.dataTransfer.files;

      if (files.length > 0) {
        const file = files[0];
        const reader = new FileReader();

        reader.onload = function (event) {
          handleFileLoad(file, event.target.result, areaId);
        };

        reader.readAsArrayBuffer(file);
      }
    }

    /**
     * ドラッグ&ドロップエリアを設定する
     * @param {number} areaId - エリアのID（1または2）
     */
    function setupDropArea(areaId) {
      const dropArea = document.getElementById(`dropArea${areaId}`);

      setupDragEvents(dropArea);
      dropArea.addEventListener('drop', (e) => handleFileDrop(e, areaId), false);
    }

    // DOM読み込み完了後の初期化処理
    document.addEventListener('DOMContentLoaded', function () {
      // CryptoJSの状態チェックと通知表示
      if (!canUseCrypto()) {
        const notice = document.getElementById('cryptoNotice');
        notice.classList.remove('hidden');
      }

      // ドロップエリアの初期化
      setupDropArea(1);
      setupDropArea(2);
    });
  </script>
</body>
